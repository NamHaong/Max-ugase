name: MaxUsage
options:
  bundleIdPrefix: com.maxusage
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Shared/Bridge/MaxUsage-Bridging-Header.h"
targets:
  MaxUsage:
    type: application
    platform: iOS
    sources:
      - MaxUsage
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxusage.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Quét ảnh trùng để dọn dẹp"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: MaxUsageWidget
      - sdk: IOKit.framework
  MaxUsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - MaxUsageWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxusage.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Max Usage"
    info:
      path: MaxUsageWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: IOKit.framework
