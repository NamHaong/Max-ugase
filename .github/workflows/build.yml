name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Chọn Xcode mới nhất có sẵn
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Cài công cụ
        run: brew install xcodegen ldid

      - name: Tạo project Xcode
        run: xcodegen generate

      - name: Build (không ký)
        run: |
          set -o pipefail
          xcodebuild \
            -project MaxUsage.xcodeproj \
            -scheme MaxUsage \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 50

      - name: Liệt kê lỗi biên dịch
        if: failure()
        run: |
          grep -E "error:" build.log | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | sort -u | head -50 | while read -r l; do echo "::error::$l"; done
          grep -E "error:" build.log | sort -u | head -50

      - name: Đóng IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/MaxUsage.app

          # 1) Bản "sạch" (không entitlement đặc quyền) -> dùng để ký lại bằng chứng chỉ doanh nghiệp/Apple ID
          mkdir -p out plain && rm -rf plain/Payload && mkdir plain/Payload
          cp -R "$APP" plain/Payload/
          (cd plain && zip -qr ../out/MaxUsage-resign.ipa Payload)

          # 2) Bản TrollStore (ldid + entitlement đặc quyền)
          ldid -SMaxUsage.entitlements "$APP/PlugIns/MaxUsageWidget.appex/MaxUsageWidget"
          ldid -SMaxUsage.entitlements "$APP/MaxUsage"
          mkdir -p troll/Payload && cp -R "$APP" troll/Payload/
          (cd troll && zip -qr ../out/MaxUsage-trollstore.tipa Payload)
          ls -lh out

      - name: Tải IPA lên
        uses: actions/upload-artifact@v4
        with:
          name: MaxUsage-ipa
          path: out/*

      - name: Tải log build lên (khi lỗi)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
